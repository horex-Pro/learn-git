<!-- 
    1. untracked files: files that are not being tracked by Git. These files are new and have not been added to the repository yet.
    2. tracked files , added files: files that are being tracked by Git. These files have been added to the repository and are being monitored for changes.
    3. modified files: files that have been changed since the last commit. These files are being tracked by Git and have been modified but not yet staged for commit.
    4. committed files: files that have been staged and committed to the repository. These files are being tracked by Git and have been saved in the repository's history.
-->
